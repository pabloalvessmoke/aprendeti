<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" fill="none">
  <!-- Icon: circuit book -->
  <rect x="4" y="6" width="32" height="38" rx="4" fill="#2563EB"/>
  <rect x="8" y="10" width="24" height="30" rx="2" fill="#1E3A8A"/>
  <!-- Circuit lines on book -->
  <circle cx="16" cy="18" r="2" fill="#60A5FA"/>
  <circle cx="28" cy="18" r="2" fill="#60A5FA"/>
  <line x1="18" y1="18" x2="26" y2="18" stroke="#60A5FA" stroke-width="1.5"/>
  <circle cx="16" cy="26" r="2" fill="#93C5FD"/>
  <circle cx="28" cy="26" r="2" fill="#93C5FD"/>
  <line x1="18" y1="26" x2="26" y2="26" stroke="#93C5FD" stroke-width="1.5"/>
  <line x1="16" y1="20" x2="16" y2="24" stroke="#60A5FA" stroke-width="1.5"/>
  <line x1="28" y1="20" x2="28" y2="24" stroke="#60A5FA" stroke-width="1.5"/>
  <line x1="16" y1="32" x2="28" y2="32" stroke="#BFDBFE" stroke-width="1" opacity="0.6"/>
  <line x1="16" y1="35" x2="24" y2="35" stroke="#BFDBFE" stroke-width="1" opacity="0.4"/>
  <!-- Book spine -->
  <rect x="4" y="6" width="5" height="38" rx="2" fill="#1D4ED8"/>

  <!-- Text: AprendeTI -->
  <text x="46" y="31" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="20" fill="#1E3A8A">Aprende</text>
  <text x="154" y="31" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="20" fill="#2563EB">TI</text>
</svg>
